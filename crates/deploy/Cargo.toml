[package]
name = "mcp-proxy-deploy"
description = "Installation, uninstallation and updater."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "update-tool"
path = "src/bin/update_tool.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
getrandom.workspace = true
jsonc-parser.workspace = true
memchr.workspace = true
reqwest.workspace = true
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "rt", "time"] }
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
mcp-proxy-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
