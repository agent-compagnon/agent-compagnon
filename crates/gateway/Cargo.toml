[package]
name = "mcp-proxy-gateway"
description = "Tool registry, upstream clients, middleware chain, MCP server and bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "snapshot-catalog"
path = "src/bin/snapshot_catalog.rs"

[dependencies]
async-trait.workspace = true
futures.workspace = true
getrandom.workspace = true
mcp-proxy-core = { path = "../core" }
reqwest.workspace = true
rmcp = { workspace = true, features = [
    "server",
    "client",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "reqwest-native-tls",
    "elicitation",
    "request-state",
] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sse-stream.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
base64.workspace = true
http.workspace = true
mcp-proxy-testkit = { path = "../testkit" }
zeroize.workspace = true

[lints]
workspace = true
