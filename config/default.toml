[[mcp]]
id = "jira"
alias = "jira"
label = "Jira"
kind = "local"
module = "jira-local"
session = "sso-tools"
rate_limit = { per_minute = 60, burst = 10 }
[mcp.instances]
rec = { base_url = "https://jira.example.internal" }
prod = { base_url = "https://jira.example.internal" }
[mcp.tools]
search_issues = { category = "read" }
get_issue = { category = "read" }
add_comment = { category = "write" }

# --- Politique de base ---------------------------------------------------------------------------------------------
# Arbre : racine → env → mcp → tool. Sévérité : allow < confirm (elicitation) < confirm (notification) < deny.

[policy]
default = { decision = "confirm", channel = "notification" }
read = { decision = "allow" }
destructive = { decision = "deny" }

[policy.env.pprod]
write = { decision = "confirm", channel = "notification", locked = true }

[policy.env.prod]
write = { decision = "confirm", channel = "notification", locked = true }

[policy.env.prod.mcp.kibana-logs.tool.delete_index]
rule = { decision = "deny", locked = true }

[policy.env.prod.mcp.k8s-admin]
destructive = { decision = "deny", locked = true }

[policy.env.prod.mcp.db-readonly.tool.run_select]
rule = { decision = "confirm", channel = "notification" }

# --- Profils -------------------------------------------------------------------------------------------------------

[profiles.developpeur]
label = "Développeur"
default_environments = ["dev", "int", "rec"]
unknown_tools = "confirm"           # confirm (notification obligatoire) | deny

# Environnements de travail du développeur : tout est autorisé, sauf le destructif (et l'inconnu, traité comme
# destructif), soumis à confirmation dans le chat quand le client le permet. `unknown_tools` relève l'inconnu à la
# notification. PPROD et PROD gardent les verrous de la base.
[profiles.developpeur.policy.env.dev]
default = { decision = "allow" }
destructive = { decision = "confirm", channel = "elicitation" }

[profiles.developpeur.policy.env.int]
default = { decision = "allow" }
destructive = { decision = "confirm", channel = "elicitation" }

[profiles.developpeur.policy.env.rec]
default = { decision = "allow" }
destructive = { decision = "confirm", channel = "elicitation" }

[profiles.support]
label = "Support"
default_environments = ["rec", "pprod", "prod"]
unknown_tools = "confirm"

[profiles.support.policy.env.prod.mcp.k8s-admin]
write = { decision = "deny" }

[profiles.lecture-seule]
label = "Lecture seule"
strictest = true                    # profil de repli quand les réglages sont invalides
default_environments = ["rec"]
unknown_tools = "deny"

[profiles.lecture-seule.policy]
write = { decision = "deny", locked = true }
destructive = { decision = "deny", locked = true }
