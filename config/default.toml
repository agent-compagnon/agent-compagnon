# --- MCP -----------------------------------------------------------------------------------------------------------

[[mcp]]
id = "kibana-logs"
alias = "kibana"
label = "Kibana Logs"
kind = "remote"                     # remote | local
session = "env"                     # "env" = SSO de l'environnement de l'instance, sinon id d'une session globale
list_requires_auth = true
rate_limit = { per_minute = 60, burst = 10 }
[mcp.instances]
dev = { url = "https://kibana-mcp.dev.example.internal/mcp" }
int = { url = "https://kibana-mcp.int.example.internal/mcp" }
qua = { url = "https://kibana-mcp.qua.example.internal/mcp" }
rec = { url = "https://kibana-mcp.rec.example.internal/mcp" }
perf = { url = "https://kibana-mcp.perf.example.internal/mcp" }
pprod = { url = "https://kibana-mcp.pprod.example.internal/mcp" }
prod = { url = "https://kibana-mcp.prod.example.internal/mcp" }
pra = { url = "https://kibana-mcp.pra.example.internal/mcp" }
[mcp.tools]
search_logs = { category = "read" }
get_log_entry = { category = "read" }
list_indices = { category = "read" }
delete_index = { category = "destructive" }

[[mcp]]
id = "gitlab-ops"
alias = "gitlab"
label = "GitLab Ops"
kind = "remote"
session = "sso-corp"
rate_limit = { per_minute = 120, burst = 20 }
[mcp.instances]
dev = { url = "https://gitlab-mcp.dev.example.internal/mcp" }
rec = { url = "https://gitlab-mcp.rec.example.internal/mcp" }
prod = { url = "https://gitlab-mcp.example.internal/mcp" }
[mcp.tools]
list_pipelines = { category = "read" }
get_job_log = { category = "read" }
retry_job = { category = "write" }
cancel_pipeline = { category = "write" }
delete_branch = { category = "destructive" }
# Sans catégorie : les annotations du serveur (readOnlyHint, destructiveHint) décideront, sinon destructif (S11).
get_merge_request = {}
add_merge_request_note = {}

[[mcp]]
id = "k8s-admin"
alias = "k8s"
label = "Kubernetes Admin"
kind = "remote"
session = "env"
list_requires_auth = true
rate_limit = { per_minute = 30, burst = 5 }
[mcp.instances]
dev = { url = "https://k8s-mcp.dev.example.internal/mcp" }
int = { url = "https://k8s-mcp.int.example.internal/mcp" }
rec = { url = "https://k8s-mcp.rec.example.internal/mcp" }
perf = { url = "https://k8s-mcp.perf.example.internal/mcp" }
pprod = { url = "https://k8s-mcp.pprod.example.internal/mcp" }
prod = { url = "https://k8s-mcp.prod.example.internal/mcp" }
pra = { url = "https://k8s-mcp.pra.example.internal/mcp" }
[mcp.tools]
list_pods = { category = "read" }
get_pod_logs = { category = "read" }
scale_deployment = { category = "write" }
restart_deployment = { category = "write" }
delete_pod = { category = "destructive" }

[[mcp]]
id = "db-readonly"
alias = "db"
label = "Base de données (lecture)"
kind = "remote"
session = "sso-corp"
rate_limit = { per_minute = 30, burst = 5 }
