# Configuration embarquée de MCP Proxy.
#
# Données d'exemple : tous les hôtes sont fictifs (*.example.internal). Les clés sont en anglais ASCII (S13).
# Toute modification est validée strictement au démarrage : voir mcp_proxy_core::config.

schema_version = 1

[gateway]
call_budget_secs = 50
confirmation_timeout_secs = 30
auth_timeout_secs = 45
upstream_timeout_secs = 120
slow_call_threshold_secs = 5
tool_name_max_len = 64
exposed_tools_warning_threshold = 100
refresh_interval_secs = 300
list_ttl_secs = 60
elicitation_clients = []            # valeurs de clientInfo.name jugées fiables pour le canal elicitation

[trace]
ring_capacity = 500
ring_max_bytes = 33554432
log_retention_days = 7

[webview]
profile = "in_memory"               # in_memory | ephemeral_disk
os_primary_account_sso = false

[update]
base_url = "https://artifactory.example.internal/artifactory"
repository = "generic-release-local"
path = "mcp-proxy"
check_interval_hours = 6

# Clés sensibles du filtre de sortie, ajoutées aux valeurs par défaut (qui ne peuvent pas être retirées).
[filter]
extra_key_segments = []             # dernier mot d'un nom de clé, ex. "passphrase"
extra_keys = []                     # nom de clé complet, ex. "x-auth-key"

# --- Environnements ------------------------------------------------------------------------------------------------

[[environments]]
id = "dev"
label = "DEV"
description = "Développement"

[[environments]]
id = "int"
label = "INT"
description = "Intégration"

[[environments]]
id = "qua"
label = "QUA"
description = "Qualification"

[[environments]]
id = "rec"
label = "REC"
description = "Recette"

[[environments]]
id = "perf"
label = "PERF"
description = "Performance"

[[environments]]
id = "pprod"
label = "PPROD"
description = "Préproduction"
