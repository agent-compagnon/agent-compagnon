# Checks only (spec 001, ui/ added by spec 011). Windows build and release jobs arrive with step 7c.
# Both jobs need Node: `ui/` is linted, tested and built, and `ui/dist` must exist before the Windows clippy run
# (`tauri::generate_context!` reads it).
stages:
  - lint
  - test

default:
  image: rust:1.97.0
  before_script:
    # Installs the toolchain, components and Windows target pinned by rust-toolchain.toml.
    - rustup toolchain install
    - cargo --version
    - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
    - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    - node --version && npm --version
  cache:
    key:
      files:
        - Cargo.lock
        - ui/package-lock.json
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/
      - .npm/
      - target/

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "22.23.5"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

lint:
  stage: lint
  script:
    - cargo xtask ci lint

test:
  stage: test
  script:
    - cargo xtask ci test
