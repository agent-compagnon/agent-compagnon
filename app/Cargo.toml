[package]
name = "mcp-proxy"
description = "MCP Proxy: the Windows application (notification icon, gateway) and its stdio bridge. Wiring only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mcp-proxy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[target.'cfg(windows)'.dependencies]
mcp-proxy-auth = { path = "../crates/auth" }
mcp-proxy-core = { path = "../crates/core" }
mcp-proxy-gateway = { path = "../crates/gateway" }
rfd = { workspace = true }
serde_json.workspace = true
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance.workspace = true
tokio = { workspace = true, features = ["io-std", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
winreg.workspace = true
zeroize.workspace = true

[lints]
workspace = true
