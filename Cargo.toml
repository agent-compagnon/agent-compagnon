[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/auth",
    "crates/gateway",
    "crates/deploy",
    "crates/testkit",
    "crates/ci-check",
    "crates/modules/jira-local",
    "xtask",
    "app",
]
# `app/` is Windows-only: checked with `--target x86_64-pc-windows-msvc`, never built for the host.
default-members = [
    "crates/core",
    "crates/auth",
    "crates/gateway",
    "crates/deploy",
    "crates/testkit",
    "crates/ci-check",
    "crates/modules/jira-local",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = "3.0.0"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
futures = "0.3.31"
getrandom = "0.4.3"
hmac = { version = "0.13.0", features = ["zeroize"] }
http = "1.3"
jsonc-parser = { version = "0.34.0", default-features = false }
memchr = "2.8.3"
mslnk = "0.1.8"
proptest = "1.12.0"
regex = "1.13.2"
rfd = { version = "0.18.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
rmcp = { version = "3.11.0", default-features = false }
secrecy = "0.10.3"
self-replace = "1.5.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
sse-stream = "0.2.6"
tauri = "2.12.7"
tauri-build = "2.7.6"
tauri-plugin-single-instance = "2.5.5"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-util = "0.7.15"
toml = "1.2.2"
tracing = "0.1.44"
tracing-log = { version = "0.2.0", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std", "tracing-log"] }
url = "2.5.9"
windows = "0.62.2"
winreg = "0.56.0"
yaml-rust2 = { version = "0.13.0", default-features = false }
zeroize = "1.9.2"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"

# Test binaries link the whole MCP and HTTP stack: with full debug info for dependencies, `target/` grew past 30 GB
# and filled the disk. Line tables for our own code keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
