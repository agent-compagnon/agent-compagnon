[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/auth",
    "crates/gateway",
    "crates/deploy",
    "crates/testkit",
    "crates/modules/jira-local",
    "xtask",
]
# `app/` (step 5a) is Windows-only and will stay out of the default members.
default-members = [
    "crates/core",
    "crates/auth",
    "crates/gateway",
    "crates/deploy",
    "crates/testkit",
    "crates/modules/jira-local",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
memchr = "2.8.3"
proptest = "1.12.0"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
url = "2.5.9"
windows = "0.62.2"
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
